[package]
name = "weilguard"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
weil_macros = { git = "https://github.com/weilliptic-inc/wadk", branch = "main" }
weil_sdk    = { git = "https://github.com/weilliptic-inc/wadk", branch = "main" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"

[profile.release]
opt-level   = "z"   # Optimise for size (WASM)
lto         = true
codegen-units = 1
